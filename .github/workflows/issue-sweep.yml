name: Issue-Triggered Sweep

# Dispatched by the Google Apps Script backend (leaderboard/Code.gs →
# dispatchSweepIfReady_) after a 1-hour debounce window since the last
# bug/feature report was filed via the in-game portal. Runs the same
# /bug-sweep command as the daily cron but fires on a playtester-batch
# cadence rather than a fixed schedule.
#
# The dispatch is triggered by a GitHub fine-grained PAT stored as the
# Script Property GH_DISPATCH_TOKEN in the Apps Script project. See the
# PR description for the exact steps to create and register that secret.
on:
  workflow_dispatch:

concurrency:
  group: issue-sweep
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write  # required by anthropics/claude-code-action@v1 for OIDC auth
  actions: write   # to trigger deploy-narrative-pages.yml after a commit

jobs:
  issue-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Record starting commit
        id: before
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: >-
            /bug-sweep

            This is a fully unattended run triggered by a batch of player-filed
            reports (1-hour debounce window after the last submission). No human
            review step. Once npm run check passes and you've committed your
            fixes, run `git push origin HEAD:main` yourself so the fixes go live
            immediately. Never resolve or reclassify a report you aren't
            confident about -- leave it open with a note instead, per the
            command file's own guidance.
          claude_args: >-
            --model claude-sonnet-5
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep"
            --max-turns 40

      - name: Trigger a Pages redeploy if the sweep pushed new commits
        run: |
          after=$(git ls-remote origin -h refs/heads/main | cut -f1)
          if [ "$after" != "${{ steps.before.outputs.sha }}" ]; then
            gh workflow run deploy-narrative-pages.yml --ref main
          else
            echo "No new commits from this sweep -- skipping redeploy."
          fi
        env:
          GH_TOKEN: ${{ github.token }}
