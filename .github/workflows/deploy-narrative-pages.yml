name: Deploy to Pages

# narrative-campaign was fast-forwarded into main and retired -- main is now
# the live build, so this triggers on it instead.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

# Pages deploys are a single shared target -- queue rather than race two
# concurrent pushes against it.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # index1.html is the whole game (self-contained, no local assets) --
      # Pages just needs it served as index.html at the site root.
      #
      # nightly-builds/ (priority queue item 9, FOCUS.md) is a standing,
      # dumb static folder for over-cap chezz-classic ports that were kept
      # rather than merged or discarded -- copied as-is, no build step.
      - name: Prepare site
        run: |
          mkdir _site
          cp index1.html _site/index.html
          cp -r nightly-builds _site/nightly-builds

      - name: Verify site has what it should
        run: |
          test -f _site/nightly-builds/index.html
          test -f _site/nightly-builds/manifest.js
          node -e "
            const window = {};
            eval(require('fs').readFileSync('_site/nightly-builds/manifest.js', 'utf8'));
            if (!Array.isArray(window.NIGHTLY_BUILDS)) throw new Error('NIGHTLY_BUILDS is not an array');
          "

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment

      # FOCUS.md's domain-move park (item 9) named this as the trigger check
      # that has to actually run, not just get described: does a player
      # reach a build through both live domains right now. Runs on every
      # deploy, so drift gets caught the next push, not the next time
      # someone happens to look.
      - name: Verify live domains serve nightly-builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-live-deploy.mjs
