name: Deploy to Pages

# narrative-campaign was fast-forwarded into main and retired -- main is now
# the live build, so this triggers on it instead.
on:
  push:
    branches: ["main", "chezz-classic"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

# Pages deploys are a single shared target -- queue rather than race two
# concurrent pushes against it.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # This is a shared artifact: narrative always owns the site root,
          # including when a Classic-only push asks us to republish.
          ref: main

      # bin/build-site.sh -- Netlify runs the same script; see its header.
      # ROOT_REDIRECT: Netlify (chezz.hf7y.com, hf7y/chezz#83) is the game's
      # root now, so Pages' own root becomes a redirect there instead of a
      # second copy -- /classic/ and /nightly-builds/ are unaffected.
      - name: Prepare site
        run: ROOT_REDIRECT=1 bash bin/build-site.sh

      - name: Verify site has what it should
        run: |
          node -e "
            const window = {};
            eval(require('fs').readFileSync('_site/nightly-builds/manifest.js', 'utf8'));
            if (!Array.isArray(window.NIGHTLY_BUILDS)) throw new Error('NIGHTLY_BUILDS is not an array');
          "

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment

      # FOCUS.md's domain-move park (item 9) named this as the trigger check
      # that has to actually run, not just get described: does a player
      # reach a build through both live domains right now. Runs on every
      # deploy, so drift gets caught the next push, not the next time
      # someone happens to look.
      - name: Verify live domains serve published pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-live-deploy.mjs
