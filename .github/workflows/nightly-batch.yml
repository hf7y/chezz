name: Nightly Batch

# Runs the /nightly-batch custom command unattended -- see
# .claude/commands/nightly-batch.md. Daily, 2am America/Chicago (07:00 UTC),
# ahead of the 9am Bug Sweep so a night's feature work is in main before the
# fast sweep reads the tree.
#
# WHY THIS EXISTS: /bug-sweep's own closing section says an answered question
# issue "must NOT be acted on or closed" by the fast sweep -- it is left "for
# the nightly". But no workflow ran /nightly-batch, so nothing consumed
# answered issues at all. Four issues Zach had greenlit (#3, #4, #5, #11) sat
# unbuilt with his answers sitting in the comments. The fast sweep was
# correctly declining work that had no other consumer.
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-batch
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write  # required by anthropics/claude-code-action@v1 for OIDC auth
  actions: write   # to trigger deploy-narrative-pages.yml after a commit

jobs:
  nightly-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Record starting commit
        id: before
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ github.token }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: >-
            /nightly-batch

            This is a fully unattended run with no human review step.

            Scope note, overriding the command file: `.scheduler/FOCUS.md` is
            RETIRED and is frozen history -- do not read it for pending work
            and do not treat it as the scoping authority. The open GitHub
            issues on hf7y/chezz are the backlog. Scope yourself to the
            answered ones first (a non-agent-stamped comment from `hf7y` IS
            the answer, whatever the issue's labels or state).

            Once npm run check passes and you've committed, create a uniquely
            named branch per issue, push it, open a pull request into main,
            and run `gh pr merge --auto --squash`. Do not push directly to
            main -- main is protected and requires the `gate` check, so a
            direct push will be rejected and auto-merge will wait for CI.
            Never resolve or reclassify anything you aren't confident about;
            leave it open with a note instead.
          claude_args: >-
            --model claude-sonnet-5
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep"
            --max-turns 120

      - name: Trigger a Pages redeploy if the batch pushed new commits
        run: |
          after=$(git ls-remote origin -h refs/heads/main | cut -f1)
          if [ "$after" != "${{ steps.before.outputs.sha }}" ]; then
            gh workflow run deploy-narrative-pages.yml --ref main
          else
            echo "No new commits from this batch -- skipping redeploy."
          fi
        env:
          GH_TOKEN: ${{ github.token }}
