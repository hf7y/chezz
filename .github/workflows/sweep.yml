name: Sweep

# Runs the /bug-sweep custom command unattended -- see .claude/commands/bug-sweep.md
# for the full triage/fix/commit/tracker-update procedure it follows.
#
# Two triggers, one job. Daily at 9am America/Chicago (14:00 UTC), and on
# workflow_dispatch -- which is how the Apps Script backend fires a sweep
# after a batch of player reports (leaderboard/Code.gs's dispatchSweepIfReady_,
# 1-hour debounce since the last report). Code.gs names this file in
# GH_WORKFLOW_FILE; scripts/check-dispatch-target.mjs asserts the two agree,
# because a rename here fails as a 404 inside Apps Script that nobody reads.
#
# This was two files -- bug-sweep.yml and issue-sweep.yml -- whose
# claude-code-action steps were byte-identical. The only real difference was
# the trigger, which is an `on:` key, not a second workflow.
on:
  # 2026-08-09 failure diagnosis: `claude-code-action@v1` always attempts an
  # OIDC→app-token exchange (for git auth) even when `anthropic_api_key` is
  # set. That exchange requires the Claude Code GitHub App to be installed on
  # the repo — it isn't. Fix: pass `github_token: ${{ github.token }}` to the
  # action step, which skips the app-token exchange and uses the workflow's
  # own token for git operations instead.
  # Earlier fix (2026-07-29–2026-08-01): `id-token: write` was missing and
  # the action couldn't obtain an OIDC token at all. That is still required
  # for the workload-identity-federation path, so it stays.
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write  # required by anthropics/claude-code-action@v1 for OIDC auth
  # Needed only to nudge deploy-narrative-pages.yml afterward -- a push made
  # with the default GITHUB_TOKEN doesn't cascade-trigger other workflows'
  # `on: push` listeners, so a fresh commit here wouldn't otherwise redeploy.
  actions: write

concurrency:
  group: sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Record starting commit
        id: before
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ github.token }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: >-
            /bug-sweep

            This is a fully unattended run with no human review step. It may
            have been triggered by the daily schedule or by a batch of
            player-filed reports; either way, read the tracker and work what
            is open. Follow the command file's step 4 for branch/PR/merge --
            main is protected and requires the `gate` check. Never resolve or
            reclassify a report you aren't confident about; leave it open
            with a note instead, per the command file's own guidance.
          claude_args: >-
            --model claude-sonnet-5
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep"
            --max-turns 40

      - name: Trigger a Pages redeploy if the sweep pushed new commits
        run: |
          after=$(git ls-remote origin -h refs/heads/main | cut -f1)
          if [ "$after" != "${{ steps.before.outputs.sha }}" ]; then
            gh workflow run deploy-narrative-pages.yml --ref main
          else
            echo "No new commits from this sweep -- skipping redeploy."
          fi
        env:
          GH_TOKEN: ${{ github.token }}
