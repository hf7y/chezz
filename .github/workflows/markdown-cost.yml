# markdown-cost.yml -- price the prose in every PR diff (ported from
# hf7y/realisateur bin/markdown-cost.sh via bin/port-markdown-cost.sh).
name: markdown-cost

on:
  pull_request:

jobs:
  markdown-cost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The default range is $(git merge-base HEAD origin/main)..HEAD, so
      # origin/main has to actually exist as a remote-tracking ref. On a PR,
      # actions/checkout fetches the PR refs; main is not guaranteed among
      # them even at depth 0.
      - name: Make origin/main resolvable
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

      - name: Price the prose in this diff
        run: bash tools/markdown-cost.sh

      # BOTH STEPS, OR THE RATCHET IS A FILE NOTHING READS. The diff check
      # prices what this PR adds; --census holds the TREE against
      # tools/markdown-cost.ratchet, which only falls. Shipping the ratchet
      # without this step is build-but-don't-wire: the port wrote a baseline
      # and nothing ever compared against it. Found by hf7y/ecosim, which
      # caught it while validating its own port (hf7y/ecosim#73).
      - name: Prose ratchet -- the tree may not grow
        run: bash tools/markdown-cost.sh --census
