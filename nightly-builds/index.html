<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chezz -- nightly builds</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 3rem auto; padding: 0 1rem; color: #222; }
  h1 { font-size: 1.4rem; }
  p.lede { color: #555; }
  ul { list-style: none; padding: 0; }
  li { border: 1px solid #ddd; border-radius: 6px; padding: 0.75rem 1rem; margin-bottom: 0.75rem; }
  li a { font-weight: 600; text-decoration: none; }
  li .meta { color: #666; font-size: 0.9rem; margin-top: 0.25rem; }
  .empty { color: #666; font-style: italic; }
  a.back { display: inline-block; margin-top: 2rem; color: #555; }
</style>
</head>
<body>
<h1>Chezz -- nightly builds</h1>
<p class="lede">
  A build lands here when a <code>chezz-classic</code> port works but exceeds
  the branch's byte cap -- the work is kept rather than discarded, just not
  merged into <code>chezz-classic</code> proper. See <code>.scheduler/FOCUS.md</code>
  priority queue item 9 for the standing policy.
</p>
<ul id="list"></ul>
<a class="back" href="../">&larr; back to the game</a>
<script src="manifest.js"></script>
<script>
  (function () {
    const list = document.getElementById("list");
    const builds = window.NIGHTLY_BUILDS;
    if (!Array.isArray(builds)) {
      list.innerHTML = '<li class="empty">Couldn\'t load the build list (manifest.js missing or malformed).</li>';
      return;
    }
    if (!builds.length) {
      list.innerHTML = '<li class="empty">No builds published yet.</li>';
      return;
    }
    list.innerHTML = builds.map(b => `
      <li>
        <a href="${b.file}">${b.label}</a>
        <div class="meta">${b.date}${b.note ? " -- " + b.note : ""}</div>
      </li>
    `).join("");
  })();
</script>
</body>
</html>
